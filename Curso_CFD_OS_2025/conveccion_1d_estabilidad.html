			  <section data-markdown>
			    <script type="text/template">
			      ### Algoritmo explícito para convección

			      ``$$u_i^{n+1} = u_i^n - \text{Co}\frac{u_{i+1}^n-u_{i-1}^n}{2}$$``

			      Las simulaciones 1D muestran un deterioro debido a ciertas oscilaciones rápidas.
			      
			    </script>
			  </section>

			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann

			      Se comienza con una expresión de Fourier:


			      ``$$u_i^{n} = \sum_m A_m^n \exp\left( j k_m i \Delta x \right) $$``


			      ``$$u_i^{n} = \sum_m A_m^n \exp\left( \underbrace{j}_{\sqrt{-1}} \underbrace{k_m}_{m k_1} \underbrace{i \Delta x}_{x} \right) $$``

			      que se inserta en
			      
			      ``$$u_i^{n+1} = u_i^n - \text{Co}\frac{u_{i+1}^n-u_{i-1}^n}{2}$$``

			      
			    </script>
			  </section>


			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann: atajo

			      De todos modos, basta con probar qué modo va a dar más guerra. En

			      ``$$u_i^{n+1} = u_i^n - \text{Co}\frac{u_{i+1}^n-u_{i-1}^n}{2}$$``

			      vemos que el peor escenario es:

			      ``$$ u_{i+1}^n = -A_i^n \qquad  u_{i-1}^n = A_i^n$$``

			      (¡dibujarlo!) entonces,

			      ``$$A^{n+1} = A^n + \text{Co} A^n =  ( 1 + \text{Co}) A^n  $$.``
			      
			      El método es *inestable*: cualquier valor de Co hace que los modos rápidos se amplifiquen
			      exponencialmente.
    
			    </script>
			  </section>


			  
			  <section data-markdown>
			    <script type="text/template">
			      ### Algoritmo implícito
			      
			      ``$$u_i^{n+1} = u_i^n -  \text{Co}\frac{u_{i+1}^{n+1}-u_{i-1}^{n+1}}{2}$$``

			      El peor escenario es ahora: 

			      ``$$ u_{i+1}^{n+1} = A_i^{n+1} \qquad  u_{i-1}^{n+1} = -A_i^{n+1}$$``

			      ``$$A^{n+1} = A^n - \text{Co} A^{n+1} =  ( 1 - \text{Co}) A^{n+1}  $$``

			      ``$$A^{n+1} =\frac{1}{1- \text{Co}} A^n $$``

			      En principio, sería *condicionalmente estable*: $ |1 / (1- \text{Co}) | < 1 $ si $\text{Co}>2$ (??)
			      
			    </script>
			  </section>

			  <section data-markdown>
			    <script type="text/template">
			      ### Interpolación upwind

			      La interpolación lineal resulta ser bastante mala para estos problemas. Es
			      mucho mejor un esquema "upwind":

			      ``$$ u_{i-1/2} \approx  u_{i-1}  $$``

			      ``$$ u_{i+1/2} \approx  u_{i}    $$``
			      
			    </script>
			  </section>


			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann de la nterpolación upwind explícita

			      ``$$u_i^{n+1} = u_i^n - \text{Co} ( u_{i}^n-u_{i-1}^n )$$``

			      El peor escenario es:

			      ``$$ u_{i-1}^n = - A_i^n$$``

			      (¡dibujarlo!) entonces,

			      ``$$A^{n+1} = A^n - 2 \text{Co} A^n =  ( 1 - 2 \text{Co}) A^n  $$.``

			      El método es *condicionalmente estable*: $ | 1 - 2 \text{Co} | < 1 $ si $\text{Co}<1$

    
			    </script>
			  </section>


			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann de la nterpolación upwind implícita

			      ``$$u_i^{n+1} = u_i^n - \text{Co} ( u_{i}^{n+1}-u_{i-1}^{n+1} )$$``

			      Comprobar:

			      ``$$A^{n+1} = A^n - 2 \text{Co} A^{n+1} \qquad \to \qquad  A^{n+1} = \frac{1}{ 1 + 2 \text{Co} }  A^n  , $$``

			      El método es *incondicionalmente estable*.

    
			    </script>
			  </section>

			      ### Condiciones de contorno, estado estacionario

			      Convección, expĺícita:
			      
			      ``$$u_i^{n+1} = u_i^n - \text{Co}\frac{u_{i+1}^n-u_{i-1}^n}{2}$$``

			      Poniendo $u_i^{n+1} = u_i^n = u_i,$

			      ``$$ u_{i+1}^n = u_{i-1}^n$$``
			      

			      Comprobar:

			      ``$$A^{n+1} = A^n - 2 \text{Co} A^{n+1} \qquad \to \qquad  A^{n+1} = \frac{1}{ 1 + 2 \text{Co} }  A^n  , $$``

			      El método es *incondicionalmente estable*.

    
			    </script>
