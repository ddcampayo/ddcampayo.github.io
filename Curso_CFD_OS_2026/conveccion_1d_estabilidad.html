			  <section data-markdown>
			    <script type="text/template">
			      ### Algoritmo explícito para convección

			      $$f_i^{n+1} = f_i^n - \text{Co}\frac{f_{i+1}^n-f_{i-1}^n}{2}$$

			      Las simulaciones 1D muestran un deterioro debido a ciertas oscilaciones rápidas.
			      
			    </script>
			  </section>

			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann

			      Se comienza con una expresión de Fourier:


			      $$f_i^{n} = \sum_m A_m^n \exp\left( j k_m i \Delta x \right), $$
			      
			      con $j=\sqrt{-1}$, $k_m = m k_1$, $i \Delta x = x$, que se inserta en
			      
			      $$f_i^{n+1} = f_i^n - \text{Co}\frac{f_{i+1}^n-f_{i-1}^n}{2}$$

			      
			    </script>
			  </section>


			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann: atajo

			      Basta con probar qué modo va a dar más guerra. En

			      $$f_i^{n+1} = f_i^n - \text{Co}\frac{f_{i+1}^n-f_{i-1}^n}{2}$$

			      el "peor escenario" es:

			      $$ f_{i+1}^n = -A^n \qquad  f_{i-1}^n = A^n$$

			      (¡dibujarlo!) entonces,

			      $$A^{n+1} = A^n + \text{Co} A^n =  ( 1 + \text{Co}) A^n . $$
			      
			      Inestable! *cualquier* valor de Co hace que los modos rápidos se amplifiquen
			      exponencialmente.
    
			    </script>
			  </section>


			  
			  <section data-markdown>
			    <script type="text/template">
			      ### Algoritmo implícito
			      
			      $$f_i^{n+1} = f_i^n -  \text{Co}\frac{f_{i+1}^{n+1}-f_{i-1}^{n+1}}{2}$$

			      El peor escenario es ahora: 

			      $$ f_{i+1}^{n+1} = -A^{n+1} \qquad  f_{i-1}^{n+1} = A^{n+1}$$

			      $$A^{n+1} = A^n + \text{Co} A^{n+1} =  ( 1 + \text{Co}) A^{n+1}  $$

			      $$A^{n+1} =\frac{1}{1 + \text{Co}} A^n $$

			      En principio, sería *incondicionalmente estable*: $ |1 / (1 + \text{Co}) | < 1 $.
			      
			    </script>
			  </section>

			  <section data-markdown>
			    <script type="text/template">
			      ### Interpolación upwind

			      La interpolación lineal resulta ser bastante mala para estos problemas. Es
			      mucho mejor un esquema "upwind":

			      $$ f_{i-1/2} \approx  f_{i-1}  $$

			      $$ f_{i+1/2} \approx  f_{i}    $$
			      
			    </script>
			  </section>


			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann del upwind explícito

			      $$f_i^{n+1} = f_i^n - \text{Co} ( f_{i}^n-f_{i-1}^n )$$

			      Peor escenario:

			      $$ f_{i+1}^{n+1} = A^{n+1} \qquad  f_{i-1}^n = - A_i^n$$

			      (¡dibujarlo!) entonces,

			      $$A^{n+1} = A^n - 2 \text{Co} A^n =  ( 1 - 2 \text{Co}) A^n  $$.

			      El método es *condicionalmente estable*: $ | 1 - 2 \text{Co} | < 1 $ si $\text{Co}<1$

    
			    </script>
			  </section>


			  <section data-markdown>
			    <script type="text/template">
			      ### Análisis de von Neumann de la nterpolación upwind implícita

			      $$f_i^{n+1} = f_i^n - \text{Co} ( f_{i}^{n+1}-f_{i-1}^{n+1} )$$

			      Comprobar:

			      $$A^{n+1} = A^n - 2 \text{Co} A^{n+1} \qquad \to \qquad  A^{n+1} = \frac{1}{ 1 + 2 \text{Co} }  A^n  , $$

			      El método es *incondicionalmente estable*.

    
			    </script>
			  </section>

			    <script type="text/template">
			      ### Condiciones de contorno, estado estacionario

			      Convección, expĺícita:
			      
			      $$f_i^{n+1} = f_i^n - \text{Co}\frac{f_{i+1}^n-f_{i-1}^n}{2}$$

			      Poniendo $f_i^{n+1} = f_i^n = f_i,$

			      $$ f_{i+1}^n = f_{i-1}^n$$
			      

			      Comprobar:

			      $$A^{n+1} = A^n - 2 \text{Co} A^{n+1} \qquad \to \qquad  A^{n+1} = \frac{1}{ 1 + 2 \text{Co} }  A^n  , $$

			      El método es *incondicionalmente estable*.

    
			    </script>
